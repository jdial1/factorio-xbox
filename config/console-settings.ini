; Settings scripts/prepare.py applies to Factorio's config.ini for the console (Xbox Series S/X in Developer
; Mode). Same format as config.ini: [section] then key=value. Edit freely; prepare.py sets each key in its
; section (uncommenting Factorio's "; key=default" line when there is one).

[other]
; No update checks from inside the sandbox.
check-updates=false

[input]
; Controller scheme: the pad works only in this mode, and in it Y confirms dialogs (not A).
input-method=game-controller

[debug]
; Frame and tick timing on screen; set both to never for a clean picture.
show-fps=always
show-time-usage=always

[graphics]
; The Series S has 8 GB shared by everything (the app may use about 5 GB); these keep video memory low.
max-texture-size=2048
graphics-quality=medium
video-memory-usage=low
texture-compression-level=low-quality
optimize-for-low-vram=true
show-fullscreen-flash=false
show-smoke=false
show-clouds=false
show-fog=false
show-space-dust=false
show-decoratives=false
show-particles=false
show-item-shadows=false
show-inserter-shadows=false
show-animated-water=false
show-animated-ghosts=false
show-tree-distortion=false
additional-terrain-effects=false
high-quality-animations=false
high-quality-shadows=false
high-quality-terrain=false
elevated-rail-shadows=false
show-game-simulations-in-background=false
